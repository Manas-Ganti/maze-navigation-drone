# =============================================================================
# Maze A -- "window": squeeze through a small window vs. go around by the south door
# =============================================================================
# Frame: maze-local metres, origin at the SW floor corner, +x east, +y north.
# Every collider is listed here; the env, the analytic collision check and the
# validator all read this file (never the USD stage).
#
#   y=20 +--------------------------------------------------+
#        |////////////////// enclosed ///////////////////////|
#   y=13 |==================================================|  north wall
#        |  start room      |  fast corridor   W   exit hall   goal room |
#        |   S  -------------- H1 --- H2 ------[]------ P2 -------  G    |
#        |                  |=====W_s==========D=====E_s=====|           |
#   y=7  |   (open SW area,      P1)           D                         |
#        |  slow: S -> down -> east -> door ---->  east corridor -> up -> G
#   y=0  +------------------------------------ door ----------------------+
#                                             x=10 (divider D; window [] at y=10, z 0.9-1.7)
#
# Fast route: straight line y=10 -- weave between two hanging blocks (0.3 m
# clearance) then thread a 0.8 x 0.8 m window (0.4 m clearance at its centre).
# Slow route: ground level, >= 0.7 m clearance everywhere, via a 3.5 m door.
# =============================================================================
name: maze_a_window
description: >
  Divider wall across the maze. Fast route squeezes through a 0.8 x 0.8 m window
  after weaving two hanging blocks; slow route detours through a wide south door.
bounds: [20.0, 20.0, 5.0]
floor_color: [0.22, 0.22, 0.24]
perimeter: {thickness: 0.3, color: [0.50, 0.50, 0.52]}

start: {pos: [2.0, 10.0, 1.2], yaw_deg: 0.0}
goal: {pos: [18.0, 10.0, 1.2], radius: 0.6}

primitives:
  # ---- divider at x = 10 (window at y 9.6-10.4, z 0.9-1.7; south door y 0-3.5) ----
  - {id: divider_s, type: box, pos: [10.0, 6.55, 2.5], size: [0.3, 6.1, 5.0], color: [0.72, 0.72, 0.74]}
  - {id: divider_n, type: box, pos: [10.0, 11.625, 2.5], size: [0.3, 2.45, 5.0], color: [0.72, 0.72, 0.74]}
  - {id: window_sill, type: box, pos: [10.0, 10.0, 0.45], size: [0.3, 0.8, 0.9], color: [0.92, 0.78, 0.10], tag: frame}
  - {id: window_lintel, type: box, pos: [10.0, 10.0, 3.35], size: [0.3, 0.8, 3.3], color: [0.92, 0.78, 0.10], tag: frame}
  # ---- north wall: the band y > 13 is closed off ----
  - {id: north_wall, type: box, pos: [10.0, 13.0, 2.5], size: [20.0, 0.3, 5.0], color: [0.55, 0.55, 0.58]}
  # ---- walls separating the fast corridor (north) from the slow area (south) ----
  - {id: wall_w_s, type: box, pos: [7.175, 7.0, 2.5], size: [5.35, 0.3, 5.0], color: [0.78, 0.62, 0.42]}
  - {id: wall_e_s, type: box, pos: [12.825, 7.0, 2.5], size: [5.35, 0.3, 5.0], color: [0.78, 0.62, 0.42]}
  # ---- fast corridor: hanging blocks either side of the straight line ----
  - {id: hang_1, type: box, pos: [6.0, 10.6, 1.25], size: [0.6, 0.6, 0.6], color: [0.95, 0.45, 0.08], tag: hanging}
  - {id: hang_2, type: box, pos: [8.0, 9.4, 1.25], size: [0.6, 0.6, 0.6], color: [0.95, 0.45, 0.08], tag: hanging}
  # ---- off-centre pillars in the open areas ----
  - {id: pillar_sw, type: cylinder, pos: [6.0, 4.8, 2.5], radius: 0.35, height: 5.0, color: [0.10, 0.45, 0.45], tag: pillar}
  - {id: pillar_exit, type: cylinder, pos: [13.5, 11.3, 2.5], radius: 0.35, height: 5.0, color: [0.10, 0.45, 0.45], tag: pillar}
  - {id: pillar_se, type: cylinder, pos: [14.0, 5.6, 2.5], radius: 0.35, height: 5.0, color: [0.10, 0.45, 0.45], tag: pillar}
  # ---- floor strips: per-route visual identity (visual only) ----
  - {id: floor_fast, type: box, pos: [7.25, 10.0, 0.005], size: [5.5, 1.2, 0.01], color: [0.60, 0.12, 0.12], tag: decor, collision: false}
  - {id: floor_slow_w, type: box, pos: [5.0, 2.0, 0.005], size: [7.0, 1.2, 0.01], color: [0.12, 0.22, 0.60], tag: decor, collision: false}
  - {id: floor_slow_e, type: box, pos: [15.0, 2.0, 0.005], size: [7.0, 1.2, 0.01], color: [0.12, 0.22, 0.60], tag: decor, collision: false}

routes:
  fast:
    kind: fast
    design_speed_mps: 2.0
    waypoints: [[2.0, 10.0, 1.2], [9.0, 10.0, 1.3], [11.0, 10.0, 1.3], [18.0, 10.0, 1.2]]
    signature:
      - {pos: [10.0, 10.0, 1.3], size: [1.0, 1.2, 1.2]}     # through the window
    note: weave two hanging blocks, thread the window
  slow:
    kind: slow
    design_speed_mps: 2.0
    waypoints: [[2.0, 10.0, 1.2], [3.0, 4.5, 1.2], [10.0, 1.75, 1.2], [17.25, 4.0, 1.2], [18.0, 10.0, 1.2]]
    signature:
      - {pos: [10.0, 1.75, 2.5], size: [1.0, 3.5, 5.0]}     # through the south door
    note: wide open areas, ground level, 3.5 m door
